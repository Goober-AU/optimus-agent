[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occ3-bridge"
version = "0.1.0"
description = "Experimental SGLang connector for the generic Optimus OCC-3 bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime dependencies are provided by the SGLang server image
# (torch, msgspec, fastapi). The plugin adds none of its own.
dependencies = []

[project.entry-points."sglang.srt.plugins"]
occ3_bridge = "occ3_sglang.plugin:load"

[tool.setuptools.packages.find]
include = ["occ3_sglang*"]

# Optional, build-generated artifacts. Their presence is not runtime approval.
[tool.setuptools.package-data]
occ3_sglang = ["native_profile.json", "native_sources.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
