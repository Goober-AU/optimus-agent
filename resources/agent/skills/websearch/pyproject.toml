[project]
name = "prime-agent-skill-websearch"
version = "0.2.0"
description = "Web search for Optimus Agent using Codex login and optional Serper results."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "prime-agent-runtime"]

[project.scripts]
websearch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]
